<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>اختبار الصوت بالدارجة</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b4532a'/%3E%3Cpath d='M9 12v8M14 8v16M19 11v10M24 14v4' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
  <nav class="lang" id="lang" aria-label="Language / اللغة / Langue"></nav>

  <main class="card">
    <div id="test-banner" class="banner" data-i18n="testMode" hidden></div>

    <!-- 1. Welcome + listener questions -->
    <section id="screen-welcome">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="heading"></h1>
      <p class="lead" id="lead"></p>
      <ul class="tips">
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
      </ul>

      <form id="profile" novalidate>
        <fieldset>
          <legend data-i18n="native"></legend>
          <div class="choices">
            <label><input type="radio" name="native" value="yes" required> <span data-i18n="yes"></span></label>
            <label><input type="radio" name="native" value="no"> <span data-i18n="no"></span></label>
          </div>
        </fieldset>
        <fieldset>
          <legend data-i18n="headphones"></legend>
          <div class="choices">
            <label><input type="radio" name="headphones" value="yes" required> <span data-i18n="yes"></span></label>
            <label><input type="radio" name="headphones" value="no"> <span data-i18n="speakers"></span></label>
          </div>
        </fieldset>
        <div class="row">
          <label class="field"><span data-i18n="region"></span>
            <select name="region" required></select>
          </label>
          <label class="field"><span data-i18n="age"></span>
            <select name="age_range" required></select>
          </label>
        </div>
        <label class="consent"><input type="checkbox" name="consent" required>
          <span data-i18n="consent"></span></label>
        <p id="profile-error" class="error" data-i18n="error" hidden></p>
        <button type="submit" class="primary" data-i18n="start"></button>
      </form>
    </section>

    <!-- 2. Rating -->
    <section id="screen-rate" hidden>
      <div class="progress-head">
        <span id="progress-label"></span>
        <span id="save-state" class="save-state" aria-live="polite"></span>
      </div>
      <div class="progress"><div id="progress-bar"></div></div>

      <div class="player">
        <button id="play" class="play">
          <svg id="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <div class="track"><div id="track-bar"></div></div>
        <p id="play-hint" class="hint"></p>
      </div>

      <fieldset id="q-natural" class="scale" disabled>
        <legend data-i18n="qNatural"></legend>
        <div class="options" data-name="naturalness" data-words="natural"></div>
      </fieldset>
      <fieldset id="q-clear" class="scale" disabled>
        <legend data-i18n="qClear"></legend>
        <div class="options" data-name="intelligibility" data-words="clear"></div>
      </fieldset>

      <button id="next" class="primary" data-i18n="next" disabled></button>
    </section>

    <!-- 3. Done -->
    <section id="screen-done" hidden>
      <p class="eyebrow" data-i18n="doneEyebrow"></p>
      <h1 data-i18n="thanks"></h1>
      <p class="lead" data-i18n="doneLead"></p>
      <p id="done-state" class="hint"></p>
      <button id="retry" class="primary" data-i18n="retry" hidden></button>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
